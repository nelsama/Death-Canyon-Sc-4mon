# Código en el bloque bajo; variables en el alto (RAM de 32 KB).
# $3E00-$3FFF es la pila del monitor: no se usa.
MEMORY {
    # La ROM API usa $02-$27 y $F0-$F7: no se tocan.
    ZP:   start = $0028, size = $0068, type = rw;
    LOW:  start = $0800, size = $3600, type = rw, file = %O;
    HIGH: start = $4000, size = $1F00, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = LOW,  type = ro;
    RODATA:   load = LOW,  type = ro;
    BSS:      load = HIGH, type = bss;
}
